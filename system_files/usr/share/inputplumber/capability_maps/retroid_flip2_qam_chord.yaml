# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Schema version number
version: 2

# The type of configuration schema
kind: CapabilityMap

# Name for the device event map
name: Retroid MCU Mapping (Flip2, Guide+A QAM chord)

# Unique identifier of the capability mapping
id: retroid_flip2_qam_chord

# Fork of retroid_mcu.yaml for the Flip2 specifically: unlike Mini V2/RP5,
# this board's shared-MCU gamepad has no physical extra button wired to
# BTN_BACK, so the plain "Quick Access Button" mapping every other Retroid
# device gets is dead weight here - QAM has nowhere to land. Ported from
# shuuri-labs/pocknix-os's own Flip2 capability map (rpflip2-gamepad.yaml,
# 2026-07-22), which solves this with a Guide+A chord instead of a
# dedicated button. Everything below is identical to retroid_mcu.yaml
# except the Guide/South/QuickAccess entries.
#
# Load-bearing caveat, carried over from pocknix-os's own notes: the MCU
# firmware reports BTN_MODE (Guide) as a fixed ~150ms pulse regardless of
# how long it's physically held, which is too short a window for this
# kernel's evdev chord matcher to reliably catch. This chord only works
# together with the kernel-side home_pulse_stretch_ms patch (see
# 0018-retroid-gamepad-home-pulse-stretch.patch) - without it, expect the
# chord to fire inconsistently or not at all. Also: since Guide can now
# only ever be a delayed_chord (tap-on-release), the Steam-button-hold
# family (shortcut overlay, Steam+B force quit, Steam+X keyboard) stops
# working on this device - judged an acceptable trade for QAM access, same
# call pocknix-os made.
#
# Unverified on real Flip2 hardware as of this commit (pocknix-os's own
# implementation carries the same disclaimer - their stretch value was
# only validated on RP5 via a userspace uinput shim, not on a real Flip2).
mapping:
  - name: Guide Button
    mapping_type:
      evdev: delayed_chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: Guide

  # Must precede the South entry below: chord candidates are matched in
  # YAML order (confirmed against InputPlumber 0.75.2's translator).
  - name: Quick Access Chord (Guide+A)
    mapping_type:
      evdev: chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  # Once BTN_SOUTH participates in any chord entry above, InputPlumber's
  # translator no longer falls through to a plain (non-chord) mapping for
  # it, so South has to be re-declared as its own single-source chord.
  - name: South Button
    mapping_type:
      evdev: chord
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: Start Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  # No physical button on this board sends BTN_BACK (unlike Mini V2/RP5) -
  # kept only so a future shared-hardware revision that does wire one up
  # doesn't silently lose it.
  - name: Quick Access Button (unused on current Flip2 hardware)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_BACK
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT2Y
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT2X
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_C
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left Paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_Z
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_RX
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RY
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_LEFT
          value_type: button
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_RIGHT
          value_type: button
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_DOWN
          value_type: button
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_DPAD_UP
          value_type: button
    target_event:
      gamepad:
        button: DPadUp

# List of events to filter from the source devices
filtered_events: []
